<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycling Poster Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .strava-orange {
            background-color: #FC5200;
        }
        .strava-orange:hover {
            background-color: #e04a00;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold tracking-tight mb-2">🚴 CYCLING POSTER <span class="text-[#FC5200]">GENERATOR</span></h1>
            <p class="text-slate-400">Transforme as suas pedaladas em artes épicas para o Instagram.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <div class="glass-panel rounded-2xl p-6 shadow-xl">
                <form id="posterForm" class="space-y-5">

                    <div>
                        <h2 class="text-lg font-semibold border-b border-slate-600 pb-2 mb-4 text-[#FC5200]">Fotografias & Recursos</h2>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-sm font-medium mb-1">Fotografia Base (Obrigatório)</label>
                                <input type="file" id="foto_base" name="foto_base" accept="image/jpeg, image/png" required
                                    class="w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer border border-slate-600 rounded-md p-1 bg-slate-800">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Preset HaldCLUT (Opcional - JPG/PNG)</label>
                                <input type="file" id="hald_file" name="hald_file" accept="image/jpeg, image/png"
                                    class="w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer border border-slate-600 rounded-md p-1 bg-slate-800">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Ficheiro GPX da Rota (Opcional)</label>
                                <input type="file" id="gpx_file" name="gpx_file" accept=".gpx"
                                    class="w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer border border-slate-600 rounded-md p-1 bg-slate-800">
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-lg font-semibold border-b border-slate-600 pb-2 mb-4 text-[#FC5200]">Percurso</h2>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-medium mb-1">Início</label>
                                <input type="text" name="start_loc" value="Cruzeiro do Sul" class="w-full bg-slate-800 border border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:border-[#FC5200]">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Destino</label>
                                <input type="text" name="end_loc" value="Posto Castelo" class="w-full bg-slate-800 border border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:border-[#FC5200]">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-sm font-medium mb-1">Ciclistas</label>
                                <input type="text" name="cyclists" value="João Silva & Jesuíno Jr" class="w-full bg-slate-800 border border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:border-[#FC5200]">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-sm font-medium mb-1">Mensagem de Rodapé</label>
                                <input type="text" name="mensagem_rodape" value="Pedalada Matinal" class="w-full bg-slate-800 border border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:border-[#FC5200]">
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-lg font-semibold border-b border-slate-600 pb-2 mb-4 text-[#FC5200]">Métricas Strava</h2>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-medium mb-1">Distância (km)</label>
                                <input type="number" step="0.01" name="distance" value="22.38" class="w-full bg-slate-800 border border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:border-[#FC5200]">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Tempo (H:MM:SS)</label>
                                <input type="text" name="time_str" value="1:10:48" class="w-full bg-slate-800 border border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:border-[#FC5200]">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Elevação (m)</label>
                                <input type="number" name="elevation" value="183" class="w-full bg-slate-800 border border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:border-[#FC5200]">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Velocidade (km/h)</label>
                                <input type="number" step="0.1" name="speed" value="19.0" class="w-full bg-slate-800 border border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:border-[#FC5200]">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Formato de Saída</label>
                        <select name="format_choice" class="w-full bg-slate-800 border border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:border-[#FC5200]">
                            <option value="1">Stories do Instagram (1080x1920 - 9:16)</option>
                            <option value="2">Feed do Instagram (1080x1350 - 4:5)</option>
                            <option value="3">Proporção Original da Fotografia</option>
                        </select>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full strava-orange text-white font-bold py-3 px-4 rounded-md shadow-lg transition duration-200 mt-4 flex justify-center items-center">
                        <span>Gerar Poster</span>
                        <svg id="loadingSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden ml-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>

                    <div id="errorMessage" class="hidden text-red-400 text-sm mt-2 text-center bg-red-900/30 p-2 rounded border border-red-500/50"></div>
                </form>
            </div>

            <div class="glass-panel rounded-2xl p-6 shadow-xl flex flex-col items-center justify-center min-h-[500px]">
                
                <div id="placeholder" class="text-center text-slate-500">
                    <svg class="w-24 h-24 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <p>A arte final será apresentada aqui.</p>
                </div>

                <div id="resultContainer" class="hidden w-full flex flex-col items-center">
                    <img id="resultImage" src="" alt="Poster Gerado" class="max-h-[600px] rounded-lg shadow-2xl border border-slate-600 object-contain mb-6">
                    <a id="downloadBtn" href="" download="poster_strava.jpg" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-6 rounded-full transition duration-200 border border-slate-500">
                        Transferir Imagem
                    </a>
                </div>

            </div>

        </div>
    </div>

    <script>
        document.getElementById('posterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('loadingSpinner');
            const btnText = btn.querySelector('span');
            const placeholder = document.getElementById('placeholder');
            const resultContainer = document.getElementById('resultContainer');
            const resultImage = document.getElementById('resultImage');
            const downloadBtn = document.getElementById('downloadBtn');
            const errorMessage = document.getElementById('errorMessage');

            btn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.innerText = 'A Processar e Aplicar Cor...';
            placeholder.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');

            const formData = new FormData(e.target);

            try {
                const response = await fetch('/gerar', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Ocorreu um erro no servidor ao gerar a imagem.');
                }

                const blob = await response.blob();

                const imageUrl = URL.createObjectURL(blob);
                resultImage.src = imageUrl;
                downloadBtn.href = imageUrl;
                
                placeholder.classList.add('hidden');
                resultContainer.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                errorMessage.innerText = error.message;
                errorMessage.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
                btnText.innerText = 'Gerar Poster';
            }
        });
    </script>
</body>
</html>
